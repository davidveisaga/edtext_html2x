<html><body><p>Otro ejemplo de <span style="background-color: rgb(191, 237, 210);">archivo</span>. </p>
<p><img data-local-src="../static/uploads/0e99d93eb6344a0aa8996f3bb3e1c80a.png" src="/api/images/0e99d93eb6344a0aa8996f3bb3e1c80a.png"/></p>
<p>Lo ingrese con copy/paste. no desde archivo.</p>
<!-- FILE_VIEW_FALLBACK_SCRIPT -->
<script>
(function(){
  try{
    if (location.protocol === 'file:'){
      Array.prototype.forEach.call(document.querySelectorAll('img[data-local-src]'), function(img){
        var local = img.getAttribute('data-local-src'); if(local) img.src = local; });
    }
  }catch(e){}
})();
</script>
</body></html>
